[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 30"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Bot de trading con un scheduler en background (APScheduler) + servidor
# Flask para health-check / endpoints manuales (/status, /positions,
# /emergency-stop, etc). SÍ bindea $PORT -- gunicorn lo necesita para
# responder al healthcheck de Railway y para que los endpoints manuales
# (sobre todo /emergency-stop) sean alcanzables en cualquier momento.
